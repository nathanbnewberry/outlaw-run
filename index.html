<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Newberry School has moved</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#120c28;color:#fff;font:700 1.3rem system-ui,sans-serif;text-align:center;padding:16px}a{color:#ffd76a}</style>
<script>
// The game moved from /outlaw-run/ to /newberry-school/. Send everyone there with the same page and settings,
// and clear the old offline copy so the iPad stops loading it.
(function () {
  var rest = location.pathname.replace(/^\/outlaw-run/, "") || "/";
  var to = "/newberry-school" + rest + location.search + location.hash;
  var go = function () { location.replace(to); };
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.filter(function (r) { return r.scope.indexOf("/outlaw-run/") >= 0; }).map(function (r) { return r.unregister(); })); }).then(go, go);
      setTimeout(go, 1500);
    } else go();
  } catch (e) { go(); }
})();
</script></head>
<body><p>Newberry School has moved.<br><a href="/newberry-school/">Tap here to go there</a></p></body></html>
